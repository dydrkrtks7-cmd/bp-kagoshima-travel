<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="419" cy="502" r="93" fill="#a0522d" opacity="0.14"/>
    <circle cx="880" cy="194" r="25" fill="#a0522d" opacity="0.08"/>
    <circle cx="1083" cy="-59" r="49" fill="#a0522d" opacity="0.06"/>
    <circle cx="509" cy="537" r="69" fill="#a0522d" opacity="0.08"/>
    <circle cx="105" cy="266" r="90" fill="#a0522d" opacity="0.15"/>
    <circle cx="844" cy="402" r="97" fill="#a0522d" opacity="0.19"/>
    <rect x="538" y="69" width="58" height="40" rx="8" fill="#8b4513" opacity="0.15" transform="rotate(15, 969, 681)"/>
    <rect x="677" y="331" width="28" height="82" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(33, 356, -97)"/>
    <rect x="-68" y="597" width="20" height="85" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(14, 495, 512)"/>
    <rect x="-10" y="383" width="23" height="35" rx="8" fill="#8b4513" opacity="0.15" transform="rotate(31, 929, 44)"/>
    <rect x="-80" y="305" width="74" height="71" rx="8" fill="#8b4513" opacity="0.04" transform="rotate(0, 1255, 371)"/>
    <rect x="945" y="-20" width="23" height="51" rx="8" fill="#8b4513" opacity="0.10" transform="rotate(41, 447, 672)"/>
    <rect x="394" y="449" width="29" height="84" rx="8" fill="#8b4513" opacity="0.14" transform="rotate(22, 699, 495)"/>
    <rect x="744" y="10" width="26" height="79" rx="8" fill="#8b4513" opacity="0.13" transform="rotate(34, 103, 590)"/>
    <polygon points="1171,637 1191,677 1151,677" fill="#a0522d" opacity="0.11"/>
    <polygon points="1038,-86 1084,6 992,6" fill="#a0522d" opacity="0.04"/>
    <polygon points="1030,590 1054,638 1006,638" fill="#a0522d" opacity="0.03"/>
    <polygon points="1062,-82 1126,46 998,46" fill="#a0522d" opacity="0.05"/>

  <!-- Wave at bottom -->
  <path d="M0,574 C360,602 840,546 1200,574 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Kagoshima travel 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Kagoshima — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Kagoshima Kagoshima travel 안내 — 정보
  </text>
</svg>